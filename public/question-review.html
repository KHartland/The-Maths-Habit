  <title>Question Bank Review - The Maths Habit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0E0307;
      color: #EEEBF3;
      padding: 20px;
      line-height: 1.6;
    }
    h1 { text-align: center; margin-bottom: 10px; color: #8B4CD4; }
    .stats { text-align: center; margin-bottom: 30px; color: #C0B4E3; font-size: 0.95em; }
    .filters {
      display: flex; gap: 8px; justify-content: center;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .filters button {
      padding: 8px 14px; border: 1px solid #6E33B1;
      background: transparent; color: #C0B4E3;
      border-radius: 8px; cursor: pointer; font-size: 0.85em;
    }
    .filters button.active, .filters button:hover {
      background: #6E33B1; color: white;
    }
    .objective {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 20px; margin-bottom: 20px;
    }
    .objective h2 { color: #8B4CD4; margin-bottom: 5px; font-size: 1.2em; }
    .question {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 15px; margin-bottom: 10px;
    }
    .question-text { font-size: 1.1em; margin-bottom: 10px; }
    .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.85em; margin-top: 10px; }
    .meta span { background: rgba(110, 51, 177, 0.3); padding: 4px 10px; border-radius: 6px; }
    .answer { color: #38E6A2; font-weight: bold; }
    .type { color: #67E8F9; }
    .calc-yes { color: #FBBF24; }
    .calc-no { color: #C0B4E3; }
    .marks { background: #FBBF24 !important; color: #0E0307 !important; font-weight: bold; }
    .options { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .options span {
      background: rgba(255,255,255,0.1); padding: 8px 14px;
      border-radius: 8px; font-size: 0.95em;
    }
    .options span.correct {
      background: rgba(56, 230, 162, 0.3); border: 2px solid #38E6A2;
    }
    .hint { color: #FBBF24; font-style: italic; margin-top: 8px; font-size: 0.9em; }
    .tier-higher { border-left: 3px solid #F472B6; }
    .tier-badge {
      background: #F472B6; color: white; padding: 2px 6px;
      border-radius: 4px; font-size: 0.75em; margin-left: 5px;
    }
    .section-header {
      background: linear-gradient(135deg, #6E33B1, #8B4CD4);
      padding: 15px 20px; border-radius: 12px;
      margin: 30px 0 20px; font-size: 1.3em; font-weight: bold;
    }
    .search {
      width: 100%; max-width: 400px; padding: 12px 16px;
      border: 1px solid #6E33B1; background: rgba(255,255,255,0.05);
      color: white; border-radius: 8px; margin: 0 auto 20px;
      display: block; font-size: 1em;
    }
    .search::placeholder { color: #C0B4E3; }
    .hidden { display: none !important; }
    .count-badge {
      background: #6E33B1; color: white; padding: 2px 8px;
      border-radius: 10px; font-size: 0.8em; margin-left: 8px;
    }
    .order-items, .correct-order { margin: 10px 0; }
    .order-items span, .match-item {
      background: rgba(255,255,255,0.1); padding: 8px 14px;
      border-radius: 8px; font-size: 0.95em; margin-right: 5px;
      display: inline-block; margin-bottom: 5px;
    }
    .correct-order { color: #38E6A2; font-weight: bold; }
    .match-section { display: flex; gap: 20px; margin: 10px 0; flex-wrap: wrap; }
    .match-col { flex: 1; min-width: 200px; }
    .bank-header { margin: 20px 0 10px; font-size: 1.1em; font-weight: bold; }
    .bank-header.foundation { color: #38E6A2; }
    .bank-header.higher { color: #F472B6; }
    .bank-header.exam { color: #FBBF24; }
  </style>

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderQuestion(q, bank) {
      const tierClass = q.tier === 'higher' ? ' tier-higher' : '';
      let html = '<div class="question' + tierClass + '" data-type="' + (q.type || 'text') + '" data-bank="' + bank + '">';
      html += '<div class="question-text"><strong>Q:</strong> ' + escapeHtml(q.q);
      if (q.tier === 'higher') html += ' <span class="tier-badge">HIGHER ONLY</span>';
      html += '</div>';

      // MCQ options
      if (q.type === 'mcq' && q.options && q.options.length > 0) {
        html += '<div class="options">';
        for (const opt of q.options) {
          const isCorrect = opt === q.a;
          html += '<span' + (isCorrect ? ' class="correct"' : '') + '>' + escapeHtml(opt) + '</span>';
        }
        html += '</div>';
      }

      // Order items
      if (q.type === 'order' && q.items && q.items.length > 0) {
        html += '<div class="order-items"><strong>Items:</strong> ';
        for (const item of q.items) {
          html += '<span>' + escapeHtml(item) + '</span>';
        }
        html += '</div>';
        if (q.correctOrder && q.correctOrder.length > 0) {
          html += '<div class="correct-order"><strong>Correct Order:</strong> ' + q.correctOrder.map(i => escapeHtml(i)).join(' → ') + '</div>';
        }
      }

      // Match items
      if (q.type === 'match' && q.leftItems && q.rightItems) {
        html += '<div class="match-section">';
        html += '<div class="match-col"><strong>Left:</strong><br>' + q.leftItems.map(i => '<span class="match-item">' + escapeHtml(i) + '</span>').join(' ') + '</div>';
        html += '<div class="match-col"><strong>Right:</strong><br>' + q.rightItems.map(i => '<span class="match-item">' + escapeHtml(i) + '</span>').join(' ') + '</div>';
        html += '</div>';
      }

      // Meta
      html += '<div class="meta">';
      if (q.type !== 'order' && q.a) html += '<span class="answer">A: ' + escapeHtml(q.a) + '</span>';
      html += '<span class="type">Type: ' + (q.type || 'text') + '</span>';
      html += '<span class="' + (q.calculator ? 'calc-yes' : 'calc-no') + '">' + (q.calculator ? '🧮 Calculator' : '✏️ Non-calc') + '</span>';
      if (q.marks) html += '<span class="marks">' + q.marks + ' marks</span>';
      if (q.diagram) html += '<span>📊 Diagram: ' + escapeHtml(q.diagram) + '</span>';
      html += '</div>';

      if (q.hint) {
        html += '<div class="hint">💡 Hint: ' + escapeHtml(q.hint) + '</div>';
      }

      html += '</div>';
      return html;
    }

    function render() {
      let totalQuestions = 0;
      let foundationCount = 0;
      let higherCount = 0;
      let examCount = 0;
      let higherExamCount = 0;

      for (const questions of Object.values(questionBank)) {
        foundationCount += questions.length;
        totalQuestions += questions.length;
      }
      for (const questions of Object.values(higherQuestionBank)) {
        higherCount += questions.length;
        totalQuestions += questions.length;
      }
      for (const questions of Object.values(examQuestions)) {
        examCount += questions.length;
        totalQuestions += questions.length;
      }
      for (const questions of Object.values(higherExamQuestions)) {
        higherExamCount += questions.length;
        totalQuestions += questions.length;
      }

      document.getElementById('stats').textContent =
        'Total: ' + totalQuestions + ' questions | Foundation: ' + foundationCount + ' | Higher: ' + higherCount + ' | Exam: ' + examCount + ' | Higher Exam: ' + higherExamCount;

      const allCodes = new Set([
        ...Object.keys(questionBank),
        ...Object.keys(higherQuestionBank),
        ...Object.keys(examQuestions),
        ...Object.keys(higherExamQuestions)
      ]);

      const sortedCodes = Array.from(allCodes).sort((a, b) => {
        const order = { 'N': 1, 'A': 2, 'R': 3, 'G': 4, 'P': 5, 'S': 6 };
        const prefixA = a[0], prefixB = b[0];
        const numA = parseInt(a.slice(1)), numB = parseInt(b.slice(1));
        if (order[prefixA] !== order[prefixB]) return order[prefixA] - order[prefixB];
        return numA - numB;
      });

      const prefixNames = {
        'N': 'Number',
        'A': 'Algebra',
        'R': 'Ratio, Proportion and Rates of Change',
        'G': 'Geometry and Measures',
        'P': 'Probability',
        'S': 'Statistics'
      };

      let html = '';
      let currentPrefix = '';

      for (const code of sortedCodes) {
        const prefix = code[0];
        if (prefix !== currentPrefix) {
          html += '<div class="section-header">' + (prefixNames[prefix] || prefix) + '</div>';
          currentPrefix = prefix;
        }

        const foundationQs = questionBank[code] || [];
        const higherQs = higherQuestionBank[code] || [];
        const examQs = examQuestions[code] || [];
        const higherExamQs = higherExamQuestions[code] || [];
        const totalForCode = foundationQs.length + higherQs.length + examQs.length + higherExamQs.length;

        html += '<div class="objective" data-code="' + code + '">';
        html += '<h2>' + code + ': ' + (objectiveDescriptions[code] || 'No description') + ' <span class="count-badge">' + totalForCode + ' questions</span></h2>';

        if (foundationQs.length > 0) {
          html += '<h3 class="bank-header foundation">Foundation Question Bank <span class="count-badge">' + foundationQs.length + '</span></h3>';
          for (const q of foundationQs) {
            html += renderQuestion(q, 'foundation');
          }
        }

        if (higherQs.length > 0) {
          html += '<h3 class="bank-header higher">Higher Question Bank <span class="count-badge">' + higherQs.length + '</span></h3>';
          for (const q of higherQs) {
            html += renderQuestion(q, 'higher');
          }
        }

        if (examQs.length > 0) {
          html += '<h3 class="bank-header exam">📝 Foundation Exam Questions <span class="count-badge">' + examQs.length + '</span></h3>';
          for (const q of examQs) {
            html += renderQuestion(q, 'exam');
          }
        }

        if (higherExamQs.length > 0) {
          html += '<h3 class="bank-header exam" style="color: #FF6B9D;">📝 Higher Exam Questions <span class="count-badge">' + higherExamQs.length + '</span></h3>';
          for (const q of higherExamQs) {
            html += renderQuestion(q, 'higher-exam');
          }
        }

        html += '</div>';
      }

      document.getElementById('content').innerHTML = html;
    }

    // Search functionality
    document.getElementById('search').addEventListener('input', function(e) {
      const term = e.target.value.toLowerCase();
      document.querySelectorAll('.question').forEach(q => {
        q.classList.toggle('hidden', !q.textContent.toLowerCase().includes(term));
      });
      document.querySelectorAll('.objective').forEach(obj => {
        obj.classList.toggle('hidden', obj.querySelectorAll('.question:not(.hidden)').length === 0);
      });
    });

    // Filter functionality
    document.querySelectorAll('.filters button').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const filter = this.dataset.filter;

        document.querySelectorAll('.question').forEach(q => {
          if (filter === 'all') {
            q.classList.remove('hidden');
          } else if (['foundation', 'higher', 'exam', 'higher-exam'].includes(filter)) {
            q.classList.toggle('hidden', q.dataset.bank !== filter);
          } else {
            q.classList.toggle('hidden', q.dataset.type !== filter);
          }
        });

        document.querySelectorAll('.objective').forEach(obj => {
          obj.classList.toggle('hidden', obj.querySelectorAll('.question:not(.hidden)').length === 0);
        });
      });
    });

    // Initial render
    render();
  </script>
