<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Bank Review - The Maths Habit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0E0307;
      color: #EEEBF3;
      padding: 20px;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #8B4CD4;
    }
    .stats {
      text-align: center;
      margin-bottom: 30px;
      color: #C0B4E3;
    }
    .filters {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filters button {
      padding: 8px 16px;
      border: 1px solid #6E33B1;
      background: transparent;
      color: #C0B4E3;
      border-radius: 8px;
      cursor: pointer;
    }
    .filters button.active, .filters button:hover {
      background: #6E33B1;
      color: white;
    }
    .objective {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .objective h2 {
      color: #8B4CD4;
      margin-bottom: 5px;
      font-size: 1.2em;
    }
    .objective .description {
      color: #C0B4E3;
      font-size: 0.9em;
      margin-bottom: 15px;
    }
    .question {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 10px;
    }
    .question-text {
      font-size: 1.1em;
      margin-bottom: 10px;
    }
    .meta {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      font-size: 0.85em;
    }
    .meta span {
      background: rgba(110, 51, 177, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
    }
    .answer {
      color: #38E6A2;
      font-weight: bold;
    }
    .type { color: #67E8F9; }
    .calc-yes { color: #FBBF24; }
    .calc-no { color: #C0B4E3; }
    .options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0;
    }
    .options span {
      background: rgba(255,255,255,0.1);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.9em;
    }
    .options span.correct {
      background: rgba(56, 230, 162, 0.3);
      border: 1px solid #38E6A2;
    }
    .hint {
      color: #FBBF24;
      font-style: italic;
      margin-top: 8px;
      font-size: 0.9em;
    }
    .order-items, .match-items {
      margin: 10px 0;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
    }
    .order-items h4, .match-items h4 {
      color: #C0B4E3;
      font-size: 0.85em;
      margin-bottom: 5px;
    }
    .exam-section {
      border-left: 3px solid #FBBF24;
      padding-left: 15px;
    }
    .exam-section h3 {
      color: #FBBF24;
      margin-bottom: 10px;
    }
    .marks {
      background: #FBBF24;
      color: #0E0307;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .search {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      border: 1px solid #6E33B1;
      background: rgba(255,255,255,0.05);
      color: white;
      border-radius: 8px;
      margin: 0 auto 20px;
      display: block;
      font-size: 1em;
    }
    .search::placeholder { color: #C0B4E3; }
    .hidden { display: none !important; }
    .count-badge {
      background: #6E33B1;
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.8em;
      margin-left: 8px;
    }
  </style>
</head>

    function renderRecurring(text) {
      return text.replace(/\[r\]/g, '̇');
    }

    function renderQuestion(q, isExam = false) {
      let html = `<div class="question ${isExam ? 'exam-question' : ''}">`;
      html += `<div class="question-text">${renderRecurring(q.q)}</div>`;

      if (q.options) {
        html += `<div class="options">`;
        q.options.forEach(opt => {
          const isCorrect = opt === q.a;
          html += `<span class="${isCorrect ? 'correct' : ''}">${renderRecurring(opt)}</span>`;
        });
        html += `</div>`;
      }

      if (q.type === 'order') {
        html += `<div class="order-items"><h4>Items to order:</h4>${q.items.join(' → ')}<br><strong>Correct order:</strong> ${q.correctOrder.join(' → ')}</div>`;
      }

      if (q.type === 'match') {
        html += `<div class="match-items"><h4>Match:</h4>`;
        q.leftItems.forEach((left, i) => {
          const rightIdx = q.correctMatches[i];
          html += `${left} → ${q.rightItems[rightIdx]}<br>`;
        });
        html += `</div>`;
      }

      if (q.hint) {
        html += `<div class="hint">💡 ${q.hint}</div>`;
      }

      html += `<div class="meta">`;
      html += `<span class="answer">Answer: ${renderRecurring(q.a || 'See above')}</span>`;
      html += `<span class="type">${q.type}</span>`;
      html += `<span class="${q.calculator ? 'calc-yes' : 'calc-no'}">${q.calculator ? '🧮 Calculator' : '✏️ Non-calc'}</span>`;
      if (q.diagram) html += `<span>📊 ${q.diagram}</span>`;
      if (q.marks) html += `<span class="marks">${q.marks} marks</span>`;
      html += `</div></div>`;

      return html;
    }

    function render(filter = 'all', search = '') {
      const content = document.getElementById('content');
      let html = '';
      let totalQuestions = 0;
      let totalExam = 0;

      const searchLower = search.toLowerCase();

      Object.keys(questionBank).sort().forEach(code => {
        const questions = questionBank[code];
        const exam = examQuestions[code] || [];

        let filteredQ = questions;
        let filteredE = exam;

        if (filter !== 'all' && filter !== 'exam') {
          filteredQ = questions.filter(q => q.type === filter);
          filteredE = [];
        } else if (filter === 'exam') {
          filteredQ = [];
          filteredE = exam;
        }

        if (search) {
          filteredQ = filteredQ.filter(q =>
            q.q.toLowerCase().includes(searchLower) ||
            (q.a && q.a.toLowerCase().includes(searchLower))
          );
          filteredE = filteredE.filter(q =>
            q.q.toLowerCase().includes(searchLower) ||
            (q.a && q.a.toLowerCase().includes(searchLower))
          );
        }

        if (filteredQ.length === 0 && filteredE.length === 0) return;

        html += `<div class="objective">`;
        html += `<h2>${code}<span class="count-badge">${filteredQ.length + filteredE.length}</span></h2>`;
        html += `<p class="description">${descriptions[code] || ''}</p>`;

        filteredQ.forEach(q => {
          html += renderQuestion(q);
          totalQuestions++;
        });

        if (filteredE.length > 0) {
          html += `<div class="exam-section"><h3>📝 Exam Questions</h3>`;
          filteredE.forEach(q => {
            html += renderQuestion(q, true);
            totalExam++;
          });
          html += `</div>`;
        }

        html += `</div>`;
      });

      content.innerHTML = html;
      document.getElementById('stats').textContent =
        `${totalQuestions} practice questions + ${totalExam} exam questions across ${Object.keys(questionBank).length} objectives`;
    }

    // Event listeners
    document.querySelectorAll('.filters button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(btn.dataset.filter, document.getElementById('search').value);
      });
    });

    document.getElementById('search').addEventListener('input', (e) => {
      const activeFilter = document.querySelector('.filters button.active').dataset.filter;
      render(activeFilter, e.target.value);
    });

    // Initial render
    render();
  </script>
