<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Inner shadow for the frame -->
    <linearGradient id="frameBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(200,80,180,0.5)"/>
      <stop offset="100%" stop-color="rgba(120,30,80,0.3)"/>
    </linearGradient>
  </defs>

  <!-- Glow behind the icon -->
  <rect x="30" y="30" width="452" height="452" rx="90" fill="rgba(220,50,160,0.35)" filter="url(#glow)"/>

  <!-- Dark background -->
  <rect width="512" height="512" rx="90" fill="#1A0A14"/>

  <!-- Subtle border/frame -->
  <rect width="512" height="512" rx="90" fill="none" stroke="url(#frameBorder)" stroke-width="3"/>

  <!-- Inner container for the grid -->
  <g transform="translate(96, 96)">
    <!-- 3x3 Grid of squares with varying pink/red/magenta -->
    <!-- Row 1 -->
    <rect x="0" y="0" width="90" height="90" rx="14" fill="rgba(180,30,60,0.85)"/>
    <rect x="115" y="0" width="90" height="90" rx="14" fill="rgba(200,40,80,0.9)"/>
    <rect x="230" y="0" width="90" height="90" rx="14" fill="rgba(220,50,180,0.85)"/>

    <!-- Row 2 -->
    <rect x="0" y="115" width="90" height="90" rx="14" fill="rgba(210,50,120,0.8)"/>
    <rect x="115" y="115" width="90" height="90" rx="14" fill="rgba(160,25,50,0.85)"/>
    <rect x="230" y="115" width="90" height="90" rx="14" fill="rgba(200,45,100,0.8)"/>

    <!-- Row 3 -->
    <rect x="0" y="230" width="90" height="90" rx="14" fill="rgba(220,50,170,0.85)"/>
    <rect x="115" y="230" width="90" height="90" rx="14" fill="rgba(170,30,55,0.85)"/>
    <rect x="230" y="230" width="90" height="90" rx="14" fill="rgba(215,50,150,0.9)"/>
  </g>
</svg>