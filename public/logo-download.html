<!DOCTYPE html>
<html>
<head>
  <title>The Maths Habit Logo - Download</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: system-ui, sans-serif;
      color: white;
      gap: 20px;
    }
    .logo-container {
      background: #0E0307;
      padding: 20px;
      border-radius: 20px;
    }
    canvas {
      display: block;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      background: #6E33B1;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #8B4CD4;
    }
    .sizes {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  <h1>The Maths Habit Logo</h1>
  <div class="logo-container">
    <canvas id="logo" width="512" height="512"></canvas>
  </div>
  <div class="sizes">
    <button onclick="downloadLogo(512)">Download 512x512</button>
    <button onclick="downloadLogo(256)">Download 256x256</button>
    <button onclick="downloadLogo(128)">Download 128x128</button>
  </div>

  <script>
    const canvas = document.getElementById('logo');
    const ctx = canvas.getContext('2d');

    function drawLogo(size) {
      canvas.width = size;
      canvas.height = size;

      const scale = size / 512;

      // Background
      ctx.fillStyle = '#0E0307';
      roundRect(ctx, 0, 0, size, size, 80 * scale, true, false);

      // Grid settings
      const gridOffset = 96 * scale;
      const cellSize = 96 * scale;
      const gap = 16 * scale;
      const radius = 12 * scale;

      // Opacity values for each cell (matches your app)
      const opacities = [
        [0.3, 0.6, 0.9],
        [0.5, 0.2, 0.8],
        [0.7, 0.4, 0.95]
      ];

      // Draw grid
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          const x = gridOffset + col * (cellSize + gap);
          const y = gridOffset + row * (cellSize + gap);
          const opacity = opacities[row][col];

          ctx.fillStyle = `rgba(110, 51, 177, ${opacity})`;
          roundRect(ctx, x, y, cellSize, cellSize, radius, true, false);
        }
      }

      // Border
      ctx.strokeStyle = 'rgba(110, 51, 177, 0.3)';
      ctx.lineWidth = 2 * scale;
      roundRect(ctx, 0, 0, size, size, 80 * scale, false, true);
    }

    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function downloadLogo(size) {
      drawLogo(size);
      const link = document.createElement('a');
      link.download = `the-maths-habit-logo-${size}x${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      drawLogo(512); // Reset to display size
    }

    // Initial draw
    drawLogo(512);
  </script>
</body>
</html>
