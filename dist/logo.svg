<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="80" fill="#0E0307"/>

  <!-- Inner container for the grid -->
  <g transform="translate(96, 96)">
    <!-- 3x3 Grid of squares with varying purple opacities -->
    <!-- Row 1 -->
    <rect x="0" y="0" width="96" height="96" rx="12" fill="rgba(110, 51, 177, 0.3)"/>
    <rect x="112" y="0" width="96" height="96" rx="12" fill="rgba(110, 51, 177, 0.6)"/>
    <rect x="224" y="0" width="96" height="96" rx="12" fill="rgba(110, 51, 177, 0.9)"/>

    <!-- Row 2 -->
    <rect x="0" y="112" width="96" height="96" rx="12" fill="rgba(110, 51, 177, 0.5)"/>
    <rect x="112" y="112" width="96" height="96" rx="12" fill="rgba(110, 51, 177, 0.2)"/>
    <rect x="224" y="112" width="96" height="96" rx="12" fill="rgba(110, 51, 177, 0.8)"/>

    <!-- Row 3 -->
    <rect x="0" y="224" width="96" height="96" rx="12" fill="rgba(110, 51, 177, 0.7)"/>
    <rect x="112" y="224" width="96" height="96" rx="12" fill="rgba(110, 51, 177, 0.4)"/>
    <rect x="224" y="224" width="96" height="96" rx="12" fill="rgba(110, 51, 177, 0.95)"/>
  </g>

  <!-- Subtle border -->
  <rect width="512" height="512" rx="80" fill="none" stroke="rgba(110, 51, 177, 0.3)" stroke-width="2"/>
</svg>